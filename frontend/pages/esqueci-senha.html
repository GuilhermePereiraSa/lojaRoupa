<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/login.css" />
        <title>Esqueci minha senha - Loja Leila</title>
        <!-- Adicione o link para o seu arquivo de CSS aqui -->
    </head>
    <body>
        <section id="header" style="background-color: #065a52;">
            <a href="../index.html" class="logo">
                <img src="../img/logo.png" alt="Loja Olinda Leila" />
            </a>

            <div>
                <ul id="navbar">
                    <li><a href="../index.html" style="color:aliceblue">Início</a></li>
                </ul>
            </div>
        </section>

        <div class="container">
            <h2>Recuperar Senha</h2>
            <p>
                Digite seu e-mail abaixo e enviaremos um link para você
                redefinir sua senha.
            </p>

            <form id="form-forgot-password">
                <div class="input-group">
                    <label for="email">E-mail cadastrado:</label>
                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="exemplo@email.com"
                    />
                </div>
                <button type="submit">Enviar link de recuperação</button>
            </form>

            <div
                id="forgot-message"
                style="margin-top: 15px; font-weight: bold"
            ></div>

            <p><a href="login.html">Voltar para o Login</a></p>
        </div>

        <script src="esqueci-senha.js"></script>
    </body>
</html>
