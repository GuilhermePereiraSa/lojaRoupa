<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="../css/cart.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
            rel="stylesheet"
        />

        <!--  -->
        <link
            rel="stylesheet"
            href="path/to/font-awesome/css/font-awesome.min.css"
        />

        <script src="../scripts/init.js" defer></script>

        <title>Carrinho - Loja Leila</title>
        <link rel="icon" type="image/png" href="../img/favicon.png">
    </head>
    <body>
        <section id="header">
            <a href="../index.html" class="logo">
                <img src="../img/logo.png" alt="Loja Olinda Leila" />
            </a>

            <div>
                <ul id="navbar">
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="shop.html">Loja Leila</a></li>
                    <li><a href="about.html">Sobre</a></li>
                    <li><a href="contact.html">Contato</a></li>
                    <li>
                        <a class="active" href="cart.html"
                            ><i class="ri-shopping-bag-line"></i
                        ></a>
                    </li>
                </ul>
            </div>
        </section>

        <section id="cart">
            <h2>Seu Carrinho</h2>
            <p>Seus itens selecionados aparecerão aqui.</p>
            <div id="cart-items">
                <!-- Itens do carrinho serão adicionados dinamicamente -->
            </div>

            <div
                id="delivery-options"
                style="
                    margin-top: 20px;
                    padding: 15px;
                    border: 1px solid #ddd;
                    border-radius: 8px;
                    text-align: left;
                    background-color: #f9f9f9;
                "
            >
                <h3 style="margin-bottom: 10px; font-size: 1.1rem">
                    Como deseja receber seu pedido?
                </h3>

                <div style="margin-bottom: 8px">
                    <input
                        type="radio"
                        id="retirada"
                        name="deliveryMethod"
                        value="retirada"
                        checked
                    />
                    <label for="retirada" style="cursor: pointer"
                        >Retirar na Loja (Grátis)</label
                    >
                </div>

                <div>
                    <input
                        type="radio"
                        id="entrega"
                        name="deliveryMethod"
                        value="entrega"
                    />
                    <label for="entrega" style="cursor: pointer"
                        >Entregar no meu Endereço</label
                    >
                </div>

                <div
                    id="address-container"
                    style="display: none; margin-top: 15px"
                >
                    <label
                        for="deliveryAddress"
                        style="font-weight: bold; font-size: 0.9rem"
                        >Endereço de Entrega (com ponto de referência):</label
                    >
                    <input
                        type="text"
                        id="deliveryAddress"
                        placeholder="Ex: Rua das Flores, 123 - Perto da padaria"
                        style="
                            width: 100%;
                            padding: 10px;
                            margin-top: 5px;
                            border-radius: 4px;
                            border: 1px solid #ccc;
                            box-sizing: border-box;
                        "
                    />
                </div>
            </div>
            <div id="cart-total">
                <p>Total: R$ 0,00</p>
                <button id="checkout-btn">Finalizar Compra</button>
            </div>
        </section>

        <div id="footer-container"></div>

        <script>
            fetch("footer.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("footer-container").innerHTML =
                        data;
                });
        </script>
        <script src="../scripts/cart.js"></script>
    </body>
</html>
