<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/shop.css" />

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet" />

    <script src="../scripts/init.js" defer></script>
    <script src="../scripts/shop.js" defer></script>

    <title>Loja - Ecommerce</title>
</head>

<body>
    <section id="header">
        <a href="../index.html" class="logo">
            <img src="../img/logo.png" alt="Loja Olinda Leila" />
        </a>

        <div>
            <ul id="navbar">
                <li><a href="../index.html">Início</a></li>
                <li><a class="active" href="shop.html">Loja Leila</a></li>
                <li><a href="about.html">Sobre</a></li>
                <li><a href="contact.html">Contato</a></li>
                <li>
                    <a href="cart.html"><i class="ri-shopping-bag-line"></i></a>
                </li>
            </ul>
        </div>
    </section>

    <section id="hero">
        <div class="hero-container">
            <div class="hero-text">
                <h1>Novas Roupas</h1>
                <p>Aproveita que elas acabaram de chegar!</p>
            </div>
        </div>
    </section>

    <section id="products" class="section-p1">
        <div class="pro-container"></div>
    </section>

    <section id="pagination" class="section-p1">
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#"><i class="bi bi-arrow-right"></i></a>
    </section>

    <div id="footer-container"></div>

    <script>
        fetch("footer.html")
            .then((response) => response.text())
            .then((data) => {
                document.getElementById("footer-container").innerHTML =
                    data;
            });
    </script>
</body>

</html>
