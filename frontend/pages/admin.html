<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Painel Admin - Loja Leila</title>
        <link rel="stylesheet" href="../css/style.css" />
        <style>
            .admin-container {
                max-width: 1000px;
                margin: 2rem auto;
                padding: 0 1rem;
                font-family: sans-serif;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 1rem;
            }
            th,
            td {
                padding: 12px;
                border: 1px solid #ddd;
                text-align: left;
            }
            th {
                background-color: #f4f4f4;
            }
            .status-pendente {
                background-color: #fff3cd;
                color: #856404;
                padding: 5px 10px;
                border-radius: 4px;
                font-weight: bold;
            }
            .status-pago {
                background-color: #d4edda;
                color: #155724;
                padding: 5px 10px;
                border-radius: 4px;
                font-weight: bold;
            }
            .btn-confirmar {
                background-color: #28a745;
                color: white;
                border: none;
                padding: 8px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }
            .btn-confirmar:hover {
                background-color: #218838;
            }
        </style>
    </head>
    <body>
        <div class="admin-container">
            <h1>Painel de Pedidos - Dona Leila</h1>
            <p>
                Instruções: Olhe o aplicativo do seu banco. Se o dinheiro do
                pedido caiu na conta, clique no botão verde
                <strong>"Confirmar Recebimento"</strong>.
            </p>

            <table>
                <thead>
                    <tr>
                        <th>Nº do Pedido</th>
                        <th>Data/Hora</th>
                        <th>Itens Comprados</th>
                        <th>Valor Total</th>
                        <th>Status Atual</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="admin-orders-table"></tbody>
            </table>
        </div>

        <script src="../scripts/admin.js"></script>
    </body>
</html>
