<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Painel Admin - Loja Leila</title>

        <link rel="stylesheet" href="../css/shop.css" />
        <script>
            const token = localStorage.getItem("Token");
            if (!token) {
                window.location.href = "login.html";
            } else {
                try {
                    // Lê rapidamente o token
                    const payload = JSON.parse(atob(token.split(".")[1]));
                    // Se o isAdmin não for true, bloqueia o acesso
                    if (payload.isAdmin !== true) {
                        alert(
                            "Acesso Negado: Esta página é exclusiva para a Dona Leila (Administradores).",
                        );
                        window.location.href = "shop.html"; // Chuta para a vitrine
                    }
                } catch (e) {
                    window.location.href = "login.html";
                }
            }
        </script>

        <script src="../scripts/init.js" defer></script>
    </head>
    <body>
        <section id="header">
            <div>
                <ul id="navbar">
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="shop.html">Loja Leila</a></li>
                    <li><a href="about.html">Sobre</a></li>
                    <li><a href="contact.html">Contato</a></li>
                    <li>
                        <a href="cart.html"
                            ><i class="ri-shopping-bag-line"></i
                        ></a>
                    </li>
                </ul>
            </div>
        </section>

        <section id="admin-panel" class="section-p1">
            <h2>Cadastrar Nova Roupa</h2>
            <p>Preencha os dados e envie a foto do novo produto.</p>

            <form id="formAdmin" style="max-width: 400px; margin-top: 20px">
                <div style="margin-bottom: 15px">
                    <label>Nome da Peça:</label><br />
                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Vestido Florido"
                        required
                        style="width: 100%; padding: 8px"
                    />
                </div>

                <div style="margin-bottom: 15px">
                    <label>Preço (R$):</label><br />
                    <input
                        type="number"
                        step="0.01"
                        id="preco"
                        placeholder="99.90"
                        required
                        style="width: 100%; padding: 8px"
                    />
                </div>

                <div style="margin-bottom: 15px">
                    <label>Tamanho:</label><br />
                    <select
                        id="tamanho"
                        required
                        style="width: 100%; padding: 8px"
                    >
                        <option value="P">Pequeno (P)</option>
                        <option value="M">Médio (M)</option>
                        <option value="G">Grande (G)</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px">
                    <label>Foto do Produto:</label><br />
                    <input
                        type="file"
                        id="imagem"
                        accept="image/*"
                        required
                        style="width: 100%; padding: 8px"
                    />
                </div>

                <button
                    type="submit"
                    style="
                        padding: 10px 20px;
                        background-color: #088178;
                        color: white;
                        border: none;
                        cursor: pointer;
                    "
                >
                    Salvar Produto
                </button>
            </form>
        </section>

        <script>
            document
                .getElementById("formAdmin")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const token = localStorage.getItem("Token");

                    // FormData empacota o texto e o arquivo juntos
                    const formData = new FormData();
                    formData.append(
                        "name",
                        document.getElementById("nome").value,
                    );
                    formData.append(
                        "price",
                        document.getElementById("preco").value,
                    );
                    formData.append(
                        "size",
                        document.getElementById("tamanho").value,
                    );
                    formData.append(
                        "image",
                        document.getElementById("imagem").files[0],
                    );

                    try {
                        // Lembra da porta 3001!
                        const response = await fetch(
                            "http://localhost:3001/api/produtos",
                            {
                                method: "POST",
                                headers: {
                                    // Enviamos o JWT para o guarda-costas do Back-end
                                    Authorization: `Bearer ${token}`,
                                    // IMPORTANTE: Ao usar FormData com Fetch, NÃO defina o "Content-Type".
                                    // O navegador fará isso automaticamente e colocará a tag 'boundary' da imagem.
                                },
                                body: formData,
                            },
                        );

                        const data = await response.json();
                        if (response.ok) {
                            alert(
                                "Produto cadastrado com sucesso! Vá até a loja para conferir.",
                            );
                            document.getElementById("formAdmin").reset(); // Limpa o formulário
                        } else {
                            alert("Erro: " + data.message);
                        }
                    } catch (error) {
                        console.error("Erro no upload:", error);
                        alert("Erro de comunicação com o servidor.");
                    }
                });
        </script>
    </body>
</html>
