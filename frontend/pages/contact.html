<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="../css/contact.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
            rel="stylesheet"
        />

        <!--  -->
        <link
            rel="stylesheet"
            href="path/to/font-awesome/css/font-awesome.min.css"
        />
        <script src="../scripts/init.js" defer></script>

        <title>Contato - Ecommerce</title>
        <link rel="icon" type="image/png" href="../img/favicon.png">

    </head>
    <body>
        <section id="header">
            <a href="../index.html" class="logo">
                <img src="../img/logo.png" alt="Loja Olinda Leila" />
            </a>

            <div>
                <ul id="navbar">
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="shop.html">Loja Leila</a></li>
                    <li><a href="about.html">Sobre</a></li>
                    <li><a class="active" href="contact.html">Contato</a></li>
                    <li>
                        <a href="cart.html"
                            ><i class="ri-shopping-bag-line"></i
                        ></a>
                    </li>
                </ul>
            </div>
        </section>

        <section id="contact">
            <!-- adicionar configuração para enviar email-to -->
            <h2>Entre em Contato</h2>
            <p>Para dúvidas ou sugestões, envie-nos uma mensagem.</p>
            <form>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" /><br />
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" /><br />
                <label for="message">Mensagem:</label>
                <textarea id="message" name="message"></textarea><br />
                <button type="submit">Enviar</button>
            </form>
        </section>

        <div id="footer-container"></div>

        <script>
            fetch("footer.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("footer-container").innerHTML =
                        data;
                });
        </script>
    </body>
</html>
