<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Criar Conta - Loja Leila</title>
        <link rel="stylesheet" href="../css/login.css" />
        <script defer src="../scripts/register.js"></script>
    </head>
    <body class="login">

        <section id="header" style="background-color: #065a52;">
            <a href="../index.html" class="logo">
                <img src="../img/logo.png" alt="Loja Olinda Leila" />
            </a>

            <div>
                <ul id="navbar">
                    <li><a href="../index.html" style="color:aliceblue">Início</a></li>
                </ul>
            </div>
        </section>

        <div class="container">
            <h2 class="text-center">Criar Conta</h2>
            <br />
            <form id="formRegistro">
                            <div class="input-group">
                                <label for="reg-username" class="label">Nome do Usuário</label>
                                <input type="text" id="reg-username" class="input" required />
                            </div>
                            <br />
                            <div class="input-group">
                                <label for="reg-email" class="label">E-mail</label>
                                <input type="email" id="reg-email" class="input" required />
                            </div>
                            <br />
                            <div class="input-group">
                                <label for="reg-password" class="label">Senha (mín. 8 caracteres)</label>
                                <input type="password" id="reg-password" class="input" required minlength="8" />
                            </div>
                            <br />
                            <button class="button" type="submit">Cadastrar</button>
                        </form>
            <div style="text-align: center; margin-top: 15px">
                <a href="login.html">Já tem uma conta? Entre aqui.</a>
            </div>

    </body>
</html>
