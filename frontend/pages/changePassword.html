<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Alterar Senha - Loja Leila</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <section id="header">
            <a href="../index.html" class="logo">
                <img src="../img/logo.png" alt="Loja Olinda Leila" />
            </a>

            <div>
                <ul id="navbar">
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="shop.html">Loja Leila</a></li>
                    <li><a href="about.html">Sobre</a></li>
                    <li><a href="contact.html">Contato</a></li>
                    <li>
                        <a href="cart.html"><i class="ri-shopping-bag-line"></i></a>
                    </li>
                </ul>
            </div>
        </section>

        <div class="container-auth">
            <!-- Reutilizando uma classe de container menor, tipo a do login -->
            <h2>Segurança da Conta</h2>
            <p>Preencha os dados abaixo para alterar sua senha.</p>

            <form id="form-change-password">
                <div class="form-group">
                    <label for="senhaAtual">Senha Atual</label>
                    <input type="password" id="senhaAtual" required />
                </div>

                <div class="form-group">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" id="novaSenha" required />
                </div>

                <div class="form-group">
                    <label for="confirmarNovaSenha">Confirmar Nova Senha</label>
                    <input type="password" id="confirmarNovaSenha" required />
                </div>

                <button type="submit" class="btn-principal">
                    Salvar Nova Senha
                </button>
                <div id="password-message" style="margin-top: 15px"></div>
            </form>

            <div style="margin-top: 20px; text-align: center">
                <a href="profile.html">← Voltar para o Perfil</a>
            </div>
        </div>

        <!-- Script dedicado para esta página -->
        <script src="../scripts/changePassword.js"></script>
    </body>
</html>
