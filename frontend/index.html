<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="./css/style.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
            rel="stylesheet"
        />

        <!--  -->
        <link
            rel="stylesheet"
            href="path/to/font-awesome/css/font-awesome.min.css"
        />
        <script src="./scripts/init.js" defer></script>
        <title>Ecommerce</title>
        <link rel="icon" type="image/png" href="/img/favicon.png">

    </head>
    <body>
        <section id="header">
            <a href="index.html" class="logo">
                <img src="./img/logo.png" alt="Loja Olinda Leila" />
            </a>

            <div>
                <ul id="navbar">
                    <li><a class="active" href="index.html">Início</a></li>
                    <li><a href="pages/shop.html">Loja Olinda Leila</a></li>
                    <li><a href="pages/about.html">Sobre</a></li>
                    <li><a href="pages/contact.html">Contato</a></li>
                    <li>
                        <a href="pages/cart.html"
                            ><i class="ri-shopping-bag-line"></i
                        ></a>
                    </li>
                </ul>
            </div>
        </section>

        <section id="hero">
            <div class="hero-container">
                <div class="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="./img/blog/c1.jpeg" alt="Blog 1" />
                        </div>
                        <div class="carousel-item">
                            <img src="./img/blog/c2.jpeg" alt="Blog 2" />
                        </div>
                        <div class="carousel-item">
                            <img src="./img/blog/c3.jpeg" alt="Blog 4" />
                        </div>
                        <div class="carousel-item">
                            <img src="./img/blog/c4.jpeg" alt="Blog 7" />
                        </div>
                    </div>
                    <button class="carousel-control prev" onclick="prevSlide()">
                        &#10094;
                    </button>
                    <button class="carousel-control next" onclick="nextSlide()">
                        &#10095;
                    </button>
                </div>
                <div class="hero-text">
                    <h1>Bem-vindo à Nossa Loja de Roupas</h1>
                    <p>Descubra as últimas tendências em moda.</p>
                    <a href="pages/shop.html" class="btn">Ir para Loja</a>
                </div>
            </div>
        </section>

        <script>
            let currentSlide = 0;
            const slides = document.querySelectorAll(".carousel-item");

            function showSlide(index) {
                slides.forEach((slide, i) => {
                    slide.classList.toggle("active", i === index);
                });
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length;
                showSlide(currentSlide);
            }

            function prevSlide() {
                currentSlide =
                    (currentSlide - 1 + slides.length) % slides.length;
                showSlide(currentSlide);
            }

            // intervalo de 3 segundos para mudar de slide automaticamente do carrosel
            setInterval(nextSlide, 3000);
        </script>

        <section id="products" class="section-p1">
            <h2>Roupas em Destaque</h2>
            <div class="pro-container">
                <div class="pro">
                    <img src="./img/products/p1.jpeg" alt="Roupa 1" />
                    <div class="des">
                        <span>Marca</span>
                        <h5>Calça Casual</h5>
                        <div class="star">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                        </div>
                        <h4>R$ 50,00</h4>
                    </div>
                    <a href="#"><i class="ri-shopping-cart-line cart"></i></a>
                </div>
                <div class="pro">
                    <img src="./img/products/p2.jpeg" alt="Roupa 2" />
                    <div class="des">
                        <span>Marca</span>
                        <h5>Maiô</h5>
                        <div class="star">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                        </div>
                        <h4>R$ 80,00</h4>
                    </div>
                    <a href="#"><i class="ri-shopping-cart-line cart"></i></a>
                </div>
                <div class="pro">
                    <img src="./img/products/p3.jpeg" alt="Roupa 3" />
                    <div class="des">
                        <span>Marca</span>
                        <h5>Calça Elegante</h5>
                        <div class="star">

                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                        </div>
                        <h4>R$ 120,00</h4>
                    </div>
                    <a href="#"><i class="ri-shopping-cart-line cart"></i></a>
                </div>
                <div class="pro">
                    <img src="./img/products/p4.jpeg" alt="Roupa 4" />
                    <div class="des">
                        <span>Marca</span>
                        <h5>Blusa Feminina</h5>
                        <div class="star">

                            <i class="fas fa-star"></i>
                        </div>
                        <h4>R$ 60,00</h4>
                    </div>
                    <a href="#"><i class="ri-shopping-cart-line cart"></i></a>
                </div>
            </div>
        </section>

        <div id="footer-container"></div>

        <script>
            fetch("pages/footer.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("footer-container").innerHTML =
                        data;
                });
        </script>
    </body>
</html>
